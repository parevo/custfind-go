# Runs in the public mirror parevo/custfind-go. Edit it in the main repo
# (sdks/go/.github); changes made here are overwritten.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - run: go vet ./... && go test -race ./...
      # The tag is the release for Go; ask the module proxy to fetch it now
      # so pkg.go.dev and the first `go get` don't wait.
      - run: curl -sSf "https://proxy.golang.org/github.com/parevo/custfind-go/@v/${GITHUB_REF_NAME}.info"
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
